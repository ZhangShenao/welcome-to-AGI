<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>哈皮互动视频课堂</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .panel {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .panel h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #667eea;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        .input-group textarea {
            width: 100%;
            min-height: 120px;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.3s;
        }

        .input-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .examples {
            margin-top: 20px;
            font-size: 13px;
            color: #666;
        }

        .examples h3 {
            margin-bottom: 10px;
            color: #333;
            font-size: 14px;
        }

        .examples ul {
            list-style: none;
            padding: 0;
        }

        .examples li {
            padding: 8px;
            background: #f5f5f5;
            margin-bottom: 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .examples li:hover {
            background: #eee;
        }

        .logs {
            max-height: 400px;
            overflow-y: auto;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
        }

        .log-entry {
            margin-bottom: 5px;
        }

        .video-container {
            margin-top: 20px;
            text-align: center;
        }

        .video-container video {
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        .video-placeholder {
            padding: 40px;
            background: #f5f5f5;
            border-radius: 10px;
            color: #999;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .error {
            color: #e74c3c;
            background: #fee;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
        }

        .success {
            color: #27ae60;
            background: #efe;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>🐱 哈皮互动视频课堂</h1>
            <p>输入故事主题，AI将为您生成寓教于乐的视频内容</p>
        </div>

        <div class="main-content">
            <!-- 左侧：输入面板 -->
            <div class="panel">
                <h2>📝 创建故事</h2>
                <div class="input-group">
                    <label for="prompt">请输入您的故事需求：</label>
                    <textarea id="prompt" placeholder="例如：讲一个小蝌蚪找妈妈的故事，歌颂母爱的伟大"></textarea>
                </div>
                <button class="btn" id="generateBtn" onclick="generateVideo()">
                    开始生成视频 🚀
                </button>

                <div class="examples">
                    <h3>💡 示例：</h3>
                    <ul>
                        <li onclick="setPrompt('讲一个小蝌蚪找妈妈的故事，歌颂母爱的伟大')">
                            小蝌蚪找妈妈
                        </li>
                        <li onclick="setPrompt('创作一个关于友谊的童话故事')">
                            关于友谊的故事
                        </li>
                        <li onclick="setPrompt('制作一个教孩子认识颜色的动画故事')">
                            认识颜色
                        </li>
                        <li onclick="setPrompt('讲一个小马过河的故事，鼓励孩子勇于尝试')">
                            小马过河
                        </li>
                    </ul>
                </div>
            </div>

            <!-- 右侧：日志面板 -->
            <div class="panel">
                <h2>📊 执行过程</h2>
                <div class="logs" id="logs">
                    <div class="log-entry">💡 请输入故事需求，点击"开始生成视频"按钮</div>
                </div>
            </div>
        </div>

        <!-- 视频展示区域 -->
        <div class="panel">
            <h2>🎬 生成视频</h2>
            <div class="video-container">
                <div id="videoPlaceholder" class="video-placeholder">
                    ⏳ 视频生成后将在这里播放...
                </div>
                <video id="videoPlayer" controls style="display: none;"></video>
            </div>
        </div>
    </div>

    <script>
        function setPrompt(text) {
            document.getElementById('prompt').value = text;
        }

        function addLog(message, type = 'info') {
            const logsDiv = document.getElementById('logs');
            const logEntry = document.createElement('div');
            logEntry.className = 'log-entry';

            if (type === 'error') {
                logEntry.style.color = '#e74c3c';
            } else if (type === 'success') {
                logEntry.style.color = '#27ae60';
            }

            logEntry.textContent = message;
            logsDiv.appendChild(logEntry);
            logsDiv.scrollTop = logsDiv.scrollHeight;
        }

        async function generateVideo() {
            const prompt = document.getElementById('prompt').value.trim();

            if (!prompt) {
                alert('请输入故事需求！');
                return;
            }

            const btn = document.getElementById('generateBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span> 正在生成中...';

            // 清空日志
            document.getElementById('logs').innerHTML = '';
            document.getElementById('videoPlayer').style.display = 'none';
            document.getElementById('videoPlaceholder').style.display = 'block';
            document.getElementById('videoPlaceholder').textContent = '⏳ 视频生成中，请耐心等待...';

            try {
                // 使用 Server-Sent Events 接收实时日志
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ prompt: prompt })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();

                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.slice(6));

                                if (data.type === 'log') {
                                    // 实时显示日志
                                    const type = data.message.includes('❌') ? 'error' :
                                        (data.message.includes('✅') ? 'success' : 'info');
                                    addLog(data.message, type);
                                } else if (data.type === 'success') {
                                    // 视频生成成功
                                    const videoPlayer = document.getElementById('videoPlayer');
                                    const placeholder = document.getElementById('videoPlaceholder');

                                    videoPlayer.src = '/api/video/' + data.video_path;
                                    videoPlayer.style.display = 'block';
                                    placeholder.style.display = 'none';

                                    addLog('🎉 视频生成成功！', 'success');
                                    btn.disabled = false;
                                    btn.innerHTML = '开始生成视频 🚀';
                                } else if (data.type === 'error') {
                                    // 发生错误
                                    addLog('❌ ' + data.error, 'error');
                                    document.getElementById('videoPlaceholder').textContent = '❌ 视频生成失败：' + data.error;
                                    btn.disabled = false;
                                    btn.innerHTML = '开始生成视频 🚀';
                                }
                            } catch (e) {
                                console.error('解析SSE数据错误:', e);
                            }
                        }
                    }
                }

            } catch (error) {
                addLog('❌ 发生错误: ' + error.message, 'error');
                document.getElementById('videoPlaceholder').textContent = '❌ 发生错误：' + error.message;
                btn.disabled = false;
                btn.innerHTML = '开始生成视频 🚀';
            }
        }

        // 支持回车提交
        document.getElementById('prompt').addEventListener('keydown', function (e) {
            if (e.ctrlKey && e.key === 'Enter') {
                generateVideo();
            }
        });
    </script>
</body>

</html>
